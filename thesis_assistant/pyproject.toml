[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-assistant"
version = "0.1.0"
description = "学位论文研究与规范编排助手"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
thesis-assistant = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
